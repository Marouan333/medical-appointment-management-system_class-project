version: "3.9"

services:
  # ============ INFRA ============
  postgres:
    image: postgres:16-alpine
    container_name: rdv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rdv-net]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: rdv-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks: [rdv-net]

  # ============ SERVICES ============
  auth-service:
    build: ./services/auth-service
    container_name: rdv-auth
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
    ports: ["8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rdv-net]

  patient-service:
    build: ./services/patient-service
    container_name: rdv-patient
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/patient_db
    ports: ["8002:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rdv-net]

  practitioner-service:
    build: ./services/practitioner-service
    container_name: rdv-practitioner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/practitioner_db
    ports: ["8003:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rdv-net]

  appointment-service:
    build: ./services/appointment-service
    container_name: rdv-appointment
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/appointment_db
    ports: ["8004:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rdv-net]

  notification-service:
    build: ./services/notification-service
    container_name: rdv-notification
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_db
    ports: ["8005:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rdv-net]

  analytics-service:
    build: ./services/analytics-service
    container_name: rdv-analytics
    restart: unless-stopped
    env_file: .env
    environment:
      # Reads directly from appointment_db (read-only style); analytics_db reserved for cached aggregates.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/appointment_db
    ports: ["8006:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rdv-net]

volumes:
  postgres_data: {}

networks:
  rdv-net:
    driver: bridge
